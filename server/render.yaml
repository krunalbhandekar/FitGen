# Render blueprint for the FitGen API.
# Deploy: Render dashboard > New > Blueprint > point at this repo.
# Set `rootDir` awareness by keeping this file inside /server.
services:
  - type: web
    name: fitgen-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets are intentionally not committed — set these in the Render UI.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
